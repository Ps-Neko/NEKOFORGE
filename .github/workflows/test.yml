name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # 단일 게이트 — package.json 의 `verify` 와 1:1(typecheck + lint + depcheck + deadexports + test).
      # CI 가 단계를 인라인하면 로컬 verify 와 드리프트한다(과거 deadexports/knip 누락 사례).
      # verify 하나로 묶어 "로컬 = CI" 패리티를 강제한다.
      - name: Verify (typecheck + lint + depcheck + deadexports + tests)
        run: npm run verify
      - name: Build
        run: npm run build
      - name: Benchmark
        run: npm run benchmark
